version: '3.8'

services:
  florence-vision-cluster:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    image: florence2-vision-service:latest
    container_name: florence2-vision-studio
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - FLORENCE_MODEL_ID=microsoft/Florence-2-large
      - AUTH_ENABLED=false
      - VALID_API_KEYS=florence_demo_key_2026,admin_secret_key
      - RATE_LIMIT_RPM=120
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - huggingface-cache:/root/.cache/huggingface

volumes:
  huggingface-cache:

version: "3.8"

services:
  locate-anything-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: locate-anything:latest
    container_name: locate-anything-service
    restart: unless-stopped
    ports:
      - "${LA_PORT:-8080}:8080"
    volumes:
      # Mount model from host machine to container (read-only)
      - ./models:/app/models:ro
    environment:
      - LA_MODEL_PATH=/app/models/locate-anything-q4_k.gguf
      - LA_THREADS=8
      - LA_MODE=fast
      - LA_PORT=8080
    deploy:
      resources:
        limits:
          cpus: "8.0"
          memory: 8192M
        reservations:
          memory: 5120M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
